name: RSS Collector (public executor)

on:
  schedule:
    # UTC 02:35, 08:35, 14:35, 20:35 = Asia/Shanghai 10:35, 16:35, 22:35, 04:35.
    - cron: "35 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch RSS feeds without committing state"
        required: false
        default: true
        type: boolean
      feed_ids:
        description: "JSON array of enabled Feed IDs to collect; empty means all enabled feeds"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Collector and digest both write delivery-state.json; share one lock across workflows.
  group: rss-state-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: private-source
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: kobolibra/kindle-rss-github
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 0
      - name: Check private-repository credential
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: private-source/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Collect RSS articles
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FEED_IDS: ${{ inputs.feed_ids || '' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm exec tsx scripts/collect.ts --dry-run
          else
            pnpm exec tsx scripts/collect.ts
          fi
      - name: Commit collection state
        if: always()
        run: |
          if git diff --quiet -- state/delivery-state.json; then
            echo "No collection state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/delivery-state.json
          git commit -m "Collect RSS article state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              if git diff --name-only --diff-filter=U | grep -qx 'state/delivery-state.json'; then
                git show REBASE_HEAD:state/delivery-state.json > /tmp/local-delivery-state.json
                git show origin/main:state/delivery-state.json > /tmp/remote-delivery-state.json
                node scripts/merge-delivery-state.mjs /tmp/remote-delivery-state.json /tmp/local-delivery-state.json state/delivery-state.json
                git add state/delivery-state.json
                GIT_EDITOR=true git rebase --continue
                if git push origin HEAD:main; then exit 0; fi
              fi
              git rebase --abort || true
            fi
            sleep "$attempt"
          done
          echo "Unable to push collection state after retries."
          exit 1
