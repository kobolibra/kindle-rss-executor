name: RSS to Kindle Digest (public executor)

on:
  schedule:
    # Asia/Shanghai 07:35 and 17:35 (UTC 23:35 and 09:35).
    - cron: "35 9,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Extract and build EPUBs without sending email or marking articles delivered"
        required: false
        default: true
        type: boolean
      verify_smtp:
        description: "Only verify SMTP credentials and connectivity"
        required: false
        default: false
        type: boolean
      article_keys:
        description: "JSON array of specific state article keys for a manual delivery"
        required: false
        default: ""
        type: string
      feed_ids:
        description: "JSON array of Feed IDs for a manual delivery"
        required: false
        default: ""
        type: string
      resend_all:
        description: "Rebuild and resend current articles from every enabled RSS feed"
        required: false
        default: false
        type: boolean
      filename_suffix:
        description: "Optional suffix for this manual EPUB delivery only; scheduled filenames are unchanged"
        required: false
        default: ""
        type: string
      resend_limit:
        description: "Maximum number of articles per Feed when resending all"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  # Collector and digest both write delivery-state.json; share one lock across workflows.
  group: rss-state-writer
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    defaults:
      run:
        working-directory: private-source
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: kobolibra/kindle-rss-github
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 0
      - name: Check private-repository credential
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: private-source/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run digest
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          VERIFY_SMTP: ${{ inputs.verify_smtp || 'false' }}
          ARTICLE_KEYS: ${{ inputs.article_keys || '' }}
          FEED_IDS: ${{ inputs.feed_ids || '' }}
          RESEND_ALL: ${{ inputs.resend_all || 'false' }}
          FILENAME_SUFFIX: ${{ inputs.filename_suffix || '' }}
          RESEND_LIMIT: ${{ inputs.resend_limit || '10' }}
        run: |
          EXTRA_ARGS=""
          if [ "$RESEND_ALL" = "true" ]; then EXTRA_ARGS="--resend-all"; fi
          if [ "$VERIFY_SMTP" = "true" ]; then
            pnpm exec tsx scripts/run-digest.ts --verify-smtp
          elif [ "$DRY_RUN" = "true" ]; then
            pnpm exec tsx scripts/run-digest.ts --dry-run $EXTRA_ARGS
          else
            pnpm exec tsx scripts/run-digest.ts $EXTRA_ARGS
          fi

      - name: Commit state
        if: always()
        run: |
          if git diff --quiet -- state/delivery-state.json; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/delivery-state.json
          git commit -m "Update RSS delivery state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              if git diff --name-only --diff-filter=U | grep -qx 'state/delivery-state.json'; then
                git show REBASE_HEAD:state/delivery-state.json > /tmp/local-delivery-state.json
                git show origin/main:state/delivery-state.json > /tmp/remote-delivery-state.json
                node scripts/merge-delivery-state.mjs /tmp/remote-delivery-state.json /tmp/local-delivery-state.json state/delivery-state.json
                git add state/delivery-state.json
                GIT_EDITOR=true git rebase --continue
                if git push origin HEAD:main; then exit 0; fi
              fi
              git rebase --abort || true
            fi
            sleep "$attempt"
          done
          echo "Unable to push delivery state after retries."
          exit 1
