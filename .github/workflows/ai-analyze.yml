name: AI Reading Editor (private articles, public executor)

on:
  workflow_run:
    workflows:
      - RSS Collector (public executor)
    types: [completed]
  schedule:
    # UTC: 02:55/08:55/14:55/20:55 = Beijing 10:55/16:55/22:55/04:55.
    # Pre-delivery reconciliation: UTC 23:05/09:05 = Beijing 07:05/17:05.
    - cron: "55 2,8,14,20 * * *"
    - cron: "5 9,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect eligible articles without calling the AI API or committing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Do NOT reuse rss-state-writer. This workflow only writes state/ai-analysis/*
# and must not delay or block collection and Kindle delivery.
concurrency:
  group: rss-ai-reading-editor
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      ${{ vars.AI_ENABLED == 'true' &&
          (github.event_name != 'workflow_run' ||
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: private-source
    steps:
      - name: Check out private project
        uses: actions/checkout@v4
        with:
          repository: kobolibra/kindle-rss-github
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 0
      - name: Validate private checkout and AI settings
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          test -n "$PRIVATE_REPO_TOKEN" || { echo "Missing private repository credential"; exit 1; }
          if [ "$DRY_RUN" != "true" ]; then
            test -n "$AI_API_KEY" || { echo "Missing AI_API_KEY"; exit 1; }
            test -n "$AI_MODEL" || { echo "Missing AI_MODEL"; exit 1; }
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: private-source/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Analyze pending articles
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_ARTICLES: ${{ vars.AI_MAX_ARTICLES || '30' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm exec tsx scripts/analyze-articles.ts --dry-run
          else
            pnpm exec tsx scripts/analyze-articles.ts
          fi
      - name: Persist private AI analysis (never touch delivery state)
        if: >-
          ${{ success() &&
              !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git add -A -- state/ai-analysis
          if git diff --cached --quiet; then
            echo "No new AI analysis to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cache article AI analysis"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              # Never auto-merge potentially stale analyses for the same article.
              git rebase --abort || true
              echo "AI result conflict; next scheduled run will re-evaluate."
              exit 1
            fi
            sleep "$attempt"
          done
          echo "AI state push failed; next run will safely retry."
          exit 1
